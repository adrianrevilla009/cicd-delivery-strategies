apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders
spec:
  replicas: 3
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: ghcr.io/example/orders:1.1.0
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}}
  strategy:
    blueGreen:
      activeService: orders-active
      previewService: orders-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 300
---
apiVersion: v1
kind: Service
metadata: {name: orders-active}
spec:
  selector: {app: orders}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: orders-preview}
spec:
  selector: {app: orders}
  ports: [{port: 80, targetPort: 8080}]
