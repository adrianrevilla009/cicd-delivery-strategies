name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    uses: adrianrevilla009/lab-workflows/.github/workflows/validate-config.yml@main
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "deploy the commit that just passed CI behind a feature flag"
